name: Build TWRP Recovery
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Download TWRP Minimal Manifest
      run: |
        mkdir twrp-workspace && cd twrp-workspace
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        repo init --depth=1 -u https://github.com -b twrp-11
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags
    - name: Clone Device Tree
      run: |
        mkdir -p twrp-workspace/device/oukitel/wp12
        cp -r * twrp-workspace/device/oukitel/wp12/ 2>/dev/null || true
    - name: Run Compilation
      run: |
        cd twrp-workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_wp12-eng || lunch omni_wp12-eng
        mka recoveryimage -j$(nproc)
    - name: Upload TWRP Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Oukitel-WP12
        path: twrp-workspace/out/target/product/wp12/*.img
